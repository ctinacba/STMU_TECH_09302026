<style>
:root{
  --lime:#BDF186;--mint:#86E484;--teal-deep:#02B7AD;--teal:#09D4CB;--green:#3BD99C;--green-2:#4EDA93;--navy:#05141F;--navy-deep:#030D18;
  --bg:#EEF6F3;--surface:#FFFFFF;--surface-2:#E1EFEA;--ink:#05141F;--ink-2:#40565F;--line:#C9DCD6;
  --accent:#017D76;--accent-soft:rgba(2,183,173,.12);--good:#0B7D50;--bad:#B83A33;--warn:#8F5B00;
  --own:#169C69;--c1:#0798A3;--c2:#5E7B8B;--c3:#B07E22;--c4:#8656BD;
  --focus:#02B7AD;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#030D18;--surface:#05141F;--surface-2:#0A2130;--ink:#E3F2EE;--ink-2:#91ABB2;--line:#16324A;
    --accent:#09D4CB;--accent-soft:rgba(9,212,203,.12);--good:#4EDA93;--bad:#FF7F74;--warn:#F2C14E;
    --own:#86E484;--c1:#09D4CB;--c2:#8FA8B8;--c3:#DDB56A;--c4:#C39DEB;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#030D18;--surface:#05141F;--surface-2:#0A2130;--ink:#E3F2EE;--ink-2:#91ABB2;--line:#16324A;
  --accent:#09D4CB;--accent-soft:rgba(9,212,203,.12);--good:#4EDA93;--bad:#FF7F74;--warn:#F2C14E;
  --own:#86E484;--c1:#09D4CB;--c2:#8FA8B8;--c3:#DDB56A;--c4:#C39DEB;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
img,svg{max-width:100%}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.015em}
h1{font-size:clamp(2.3rem,5.2vw,4.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.02}
h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--lime);color:var(--navy);padding:8px 14px;border-radius:8px;z-index:99}
.skip:focus{left:12px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font:600 .95rem/1.2 Figtree,system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn-primary{background:var(--lime);color:var(--navy)}
.btn-primary:hover{background:var(--mint)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
.field{margin-bottom:16px}
input[type=text],input[type=password],input[type=email],input[type=url],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:.82rem;color:var(--ink-2);margin-top:6px}
.error{color:var(--bad);font-weight:600;font-size:.9rem}
.notice{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem;margin:12px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill-good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* public header */
.site-head{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.site-head .wrap{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.15rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.logo .wordmark{height:36px;width:auto;flex:none;display:block}
.side .logo .wordmark{height:32px}
.tag-logo{height:52px;width:auto;display:block}
.foot-brand{display:grid;gap:10px}
.on-dark{display:none !important}
:root[data-theme="dark"] .on-light{display:none !important}
:root[data-theme="dark"] .on-dark{display:block !important}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .on-light{display:none !important}
  :root:not([data-theme="light"]) .on-dark{display:block !important}
}
.site-nav{display:flex;gap:4px;margin-left:auto}
.site-nav a{color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
.site-nav a:hover{color:var(--ink)}
.site-nav a[aria-current=page]{color:var(--ink);background:var(--surface-2)}
.head-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:inline-grid;place-items:center}
.menu-btn{display:none}
@media (max-width:920px){
  .menu-btn{display:inline-grid}
  .site-nav{display:none;position:absolute;left:0;right:0;top:68px;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:12px 24px}
  .site-nav.open{display:flex}
  .head-actions .hide-sm{display:none}
  .site-head .wrap{gap:12px}
  .head-actions{margin-left:auto}
}

/* hero */
.hero{padding:72px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero p.lead{font-size:1.2rem;color:var(--ink-2);max-width:46ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:36px}.hero{padding-top:40px}}
.answer{background:var(--navy);color:#E3F2EE;border-radius:20px;padding:22px;border:1px solid #16324A;position:relative}
.answer .ask{background:#0A2130;border-radius:14px 14px 4px 14px;padding:12px 14px;margin-left:auto;max-width:85%;font-weight:500}
.answer .reply{margin-top:16px;line-height:1.75;font-size:1.02rem}
.answer .who{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#91ABB2;margin-bottom:8px}
.claim{border-radius:4px;padding:1px 2px;transition:background .4s,box-shadow .4s}
.claim.ok.on{background:rgba(78,218,147,.18);box-shadow:inset 0 -2px 0 #4EDA93}
.claim.bad.on{background:rgba(255,127,116,.18);box-shadow:inset 0 -2px 0 #FF7F74}
.verdicts{margin-top:18px;border-top:1px solid #16324A;padding-top:14px;display:grid;gap:8px}
.verdict{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.verdict.on{opacity:1;transform:none}
.verdict b{font-weight:700}
.mark{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#05141F}
.mark.ok{background:#4EDA93}.mark.bad{background:#FF7F74}
@media (prefers-reduced-motion:reduce){.claim,.verdict{transition:none}}

/* sections */
.section{padding:64px 0;border-top:1px solid var(--line)}
.section-intro{max-width:62ch;margin-bottom:36px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.step{padding:24px;border-right:1px solid var(--line);position:relative}
.step:last-child{border-right:0}
.step-num{font:800 2.6rem/1 "Bricolage Grotesque",sans-serif;color:var(--accent);opacity:.85;margin-bottom:14px;display:block}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}}

.browser-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.browser-bar span{margin-left:8px;background:var(--surface);border-radius:6px;padding:3px 10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mock-page .mp-price{font-weight:800;font-size:1.1rem;color:#05141F}
.mock-page ul{padding-left:18px;margin:8px 0;font-size:.9rem}

mark.kw{background:#BDF186;color:#05141F;border-radius:3px;padding:0 2px}

.recs{padding-left:20px;margin:0}
.recs li{margin-bottom:10px}

function capOf(q){ const m = q.match(/\$\s?([\d,]+)/); return m ? Number(m[1].replace(/,/g, '')) : null; }
function simulate(p, q, e, d){
  const rng = mulberry32(hash(`${p.id}|${q.toLowerCase()}|${e.id}|${d}`));
  const prog = d / (DAYS - 1);
  const qBias = (hash(q.toLowerCase()) % 1000) / 1000 * .2 - .1;
  const cap = capOf(q), qual = cap == null || p.start <= cap;
  let pInc = clamp(e.inc + p.boost + qBias + .24 * prog, .04, .95);
  if (!qual) pInc *= .3;

  if (m) present.push({model:p.full, brand:OWN, s: rng() + .2 * prog + p.boost});
  SEGMENTS[p.seg].comps.forEach(([name, brand, base]) => { if (rng() < clamp(base + e.compAdj, .05, .95)) present.push({model:name, brand, s: rng() * .9 + base * .4}); });
  present.sort((a, b) => b.s - a.s);
  const r = {p:p.id, q, e:e.id, d, m, qual, cap, models: present.map(x => x.model), brands: present.map(x => x.brand), pos: m ? present.findIndex(x => x.brand === OWN) + 1 : null, wrong:[], cited:false, sent:0};

    r.cited = rng() < .3 + .35 * prog;
    const s = rng(); r.sent = s < .5 + .15 * prog ? 1 : (s < .9 ? 0 : -1);

  const s = weights.reduce((a, b) => a + b, 0);

  raw.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rem).forEach(([, i]) => fl[i]++);
  return labels.map((l, i) => ({label:l, value:fl[i]}));
}

// mode: 'auto' follows the theme, 'dark' is for dark surfaces (sidebar)
function wordmark(mode = 'auto'){
  if (mode === 'dark') return `<img class="wordmark" src="${LOGO.wmDark}" alt="VeriQuo" width="162" height="40">`;
  return `<img class="wordmark on-light" src="${LOGO.wmLight}" alt="VeriQuo" width="162" height="40"><img class="wordmark on-dark" src="${LOGO.wmDark}" alt="VeriQuo" width="162" height="40">`;
}
function taglineLogo(){

function lineChart(series, labels, {h = 250, yMax = 1, label = 'Line chart', bands = []} = {}){
  const W = 640, H = h, pl = 42, pr = 12, pt = 12, pb = 28, iw = W - pl - pr, ih = H - pt - pb, n = labels.length;
  const x = i => pl + (n > 1 ? i * iw / (n - 1) : iw / 2), y = v => pt + ih - (v / yMax) * ih;
  let g = bands.map(bd => `<rect x="${x(bd.from) - 4}" y="${pt}" width="${x(bd.to) - x(bd.from) + 8}" height="${ih}" style="fill:var(--accent-soft);opacity:${bd.on ? 1 : .35}"/><text x="${(x(bd.from) + x(bd.to)) / 2}" y="${pt + 12}" text-anchor="middle" style="font-weight:600">${esc(bd.label)}</text>`).join('');
  for (let k = 0; k <= 4; k++){ const v = yMax * k / 4; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-dasharray="${k?'3 4':''}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`; }
  labels.forEach((l, i) => { if ((i % 7 === 0 && n - 1 - i >= 4) || i === n - 1) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  const paths = series.map((s, si) => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const w = si === 0 ? 3 : 1.6;
    return `<path d="${d}" fill="none" style="stroke:var(${s.v})" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${si ? 'opacity=".85"' : ''}/>`;
  }).join('');
  const hits = labels.map((l, i) => `<rect x="${x(i) - iw/(2*(n-1))}" y="${pt}" width="${iw/(n-1)}" height="${ih}" fill="transparent"><title>${esc(l)}\n${series.map(s => `${s.name}: ${pct(s.values[i])}`).join('\n')}</title></rect>`).join('');
  const legend = `<div class="legend">${series.map(s => `<span><i style="background:var(${s.v})"></i>${esc(s.name)}</span>`).join('')}</div>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${paths}${hits}</svg>${legend}</div>`;
}
function bars(items, {fmt = v => pct(v), max = null} = {}){
  const mx = max ?? Math.max(...items.map(i => i.value), .0001);
  return `<div class="bars">${items.map(i => `<div class="bar-row${i.hl ? ' is-hl' : ''}"><span class="b-label" title="${esc(i.label)}">${esc(i.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${(i.value / mx * 100).toFixed(1)}%;background:${i.color}"></div></div><span class="b-val">${fmt(i.value)}</span></div>`).join('')}</div>`;
}
function pairBars(items, {fmt = v => pct(v), max = null} = {}){
  const mx = max ?? Math.max(...items.flatMap(i => [i.base, i.cur]), .0001);
  return `<div class="bars">${items.map(i => `<div class="bar-row pair${i.hl ? ' is-hl' : ''}"><span class="b-label" title="${esc(i.label)}">${esc(i.label)}</span><div class="pair-tracks"><div class="bar-track thin"><div class="bar-fill" style="width:${(i.base / mx * 100).toFixed(1)}%;background:var(--ink-2);opacity:.45"></div></div><div class="bar-track"><div class="bar-fill" style="width:${(i.cur / mx * 100).toFixed(1)}%;background:${i.color}"></div></div></div><span class="b-val">${fmt(i.cur)}<span class="tiny muted" style="display:block;font-weight:500">was ${fmt(i.base)}</span></span></div>`).join('')}</div><div class="legend"><span><i style="background:var(--ink-2);opacity:.45"></i>Baseline</span><span><i style="background:var(--own)"></i>New</span></div>`;
}

function sparkline(values, v = '--own'){

  const d = values.map((val, i) => `${i ? 'L' : 'M'}${(i * W / (n - 1)).toFixed(1)},${(H - 3 - val * (H - 6)).toFixed(1)}`).join('');

const DONUT_COLORS = ['var(--own)','var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
function donut(items, title){
  const r = 38, C = 2 * Math.PI * r; let off = 0;
  const segs = items.map((it, i) => { const len = it.value / 100 * C; const s = `<circle r="${r}" cx="50" cy="50" fill="none" stroke-width="16" style="stroke:${DONUT_COLORS[i % 5]}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`; off += len; return s; }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(title)}">${segs}</svg><div class="donut-key">${items.map((it, i) => `<span><i style="background:${DONUT_COLORS[i % 5]}"></i>${esc(it.label)} <b>${it.value}%</b></span>`).join('')}</div></div>`;
}
function ring(score){
  const r = 40, C = 2 * Math.PI * r, len = score / 100 * C;
  const col = score >= 80 ? 'var(--good)' : score >= 60 ? 'var(--warn)' : 'var(--bad)';
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Page score ${score} out of 100"><circle r="${r}" cx="50" cy="50" fill="none" stroke-width="10" style="stroke:var(--surface-2)"/><circle r="${r}" cx="50" cy="50" fill="none" stroke-width="10" style="stroke:${col}" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" style="fill:var(--ink);font:800 24px 'Bricolage Grotesque',sans-serif">${score}</text></svg>`;
}
function calendarHTML(month, {marked = () => false, disabled = () => false, selected = null, dayAction, prevAction, nextAction, label = 'Calendar'}){
  const y = month.getFullYear(), m = month.getMonth(), first = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<span></span>';
  for (let d = 1; d <= dim; d++){
    const dt = new Date(y, m, d), iso = isoDate(dt), dis = disabled(dt), mk = marked(dt), sel = selected === iso, today = isoDate(DEMO_TODAY) === iso;
    cells += `<button type="button" class="cal-day${mk ? ' is-marked' : ''}${sel ? ' is-selected' : ''}${today ? ' is-today' : ''}" data-action="${dayAction}" data-date="${iso}" ${dis ? 'disabled' : ''} aria-pressed="${sel}" aria-label="${fmtD(dt, {weekday:'long', month:'long', day:'numeric'})}${mk ? ', has openings' : ''}">${d}</button>`;
  }
  return `<div class="cal" aria-label="${esc(label)}"><div class="cal-head"><button type="button" data-action="${prevAction}" aria-label="Previous month">‹</button><strong>${fmtD(month, {month:'long', year:'numeric'})}</strong><button type="button" data-action="${nextAction}" aria-label="Next month">›</button></div><div class="cal-dow"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div><div class="cal-grid">${cells}</div></div>`;
}

function deltaHTML(cur, base, {kind = 'pts', better = 'up'} = {}){
  if (cur == null || base == null) return '<span class="delta flat">No baseline</span>';
  const diff = kind === 'pts' ? (cur - base) * 100 : cur - base;
  const shown = kind === 'pts' ? `${Math.abs(diff).toFixed(1)} pts` : kind === 'rank' ? Math.abs(diff).toFixed(2) : Math.abs(diff).toFixed(0);
  if (Math.abs(diff) < (kind === 'rank' ? .01 : .05)) return '<span class="delta flat">No change vs baseline</span>';
  const good = better === 'up' ? diff > 0 : diff < 0;
  if (kind === 'place') return `<span class="delta ${good ? 'up' : 'down'}">${good ? '▲ Up' : '▼ Down'} ${Math.abs(diff)} place${Math.abs(diff) > 1 ? 's' : ''} vs baseline</span>`;
  return `<span class="delta ${good ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${shown} vs baseline</span>`;
}
function kpi(label, value, delta, hero = false, sub = ''){
  return `<div class="kpi${hero ? ' hero-kpi' : ''}"><div class="k-label">${label}</div><div class="k-val">${value}</div>${delta}${sub ? `<div class="k-sub">${sub}</div>` : ''}</div>`;
}

  const shown = isBase ? base : cur;

  const period = isBase ? 'Baseline week, Aug 31–Sep 6' : cmp ? 'New week vs baseline week' : 'New week, Sep 23–29';
  const K = (label, f, key, dopt, hero = false, sub = null) => {
    const c = cur[key], bv = base[key], subTxt = sub ? sub(shown) : '';

    <dt>Hallucination rate</dt><dd>Answers that mention Dell with at least one wrong fact ÷ answers that mention Dell. Lower is better.</dd>
    <dt>Dell.com cited</dt><dd>Answers mentioning Dell that link to Dell.com ÷ answers mentioning Dell.</dd>
    <dt>GEO score</dt><dd>How well Dell shows up in AI answers, the core result of generative engine optimization. 100 × (0.5 × inclusion + 0.3 × recommendation share + 0.2 × average of 1 ÷ position).</dd>
    <dt>Baseline vs new</dt><dd>Every metric is calculated the same way for both weeks, so the change is like for like.</dd>
    <dt>Data</dt><dd>Reference configurations and prices come from published reviews and listings (source shown on each product). AI answers, engine names and competitor figures are simulated for this demo; no live requests are made.</dd>
  </dl></details>`;
}

/* ---------- queries ---------- */
function autoActions(c){
  return ['Logged with date, engine and question','Owner alerted','Correction drafted','Re-test scheduled within 24 hours'];
}
function draftFix(c){
  const p = prod(c.pid);
  return {
    price:`Show ${c.truth} in the product markup (offers.price) and next to the product name. Send ${engineById(c.e).name} a correction report with a link to ${p.page.path}.`,
    features:`Add a clear “What it does and doesn’t do” list stating: ${c.truth}. Report the invented feature “${c.claimed}” to ${engineById(c.e).name}.`,
    availability:`Update offers.availability in the product markup to match “${c.truth}” and show stock status beside the price.`,
    policy:`Add return-policy markup and a visible policy line: ${c.truth}. Report the incorrect “${c.claimed}” claim to ${engineById(c.e).name}.`
  }[c.t];
}
function pageQueries(){
  const p = prod(state.qProduct), qs = state.queries[p.id];
  const remaining = MAX_QUERIES - qs.length;
  const rows = qs.map(q => {
    const recs = recordsFor(p, q);
    const at = d => recs.filter(r => r.d === d);
    const b0 = at(0), t = at(DAYS - 1), sel = state.view === 'baseline' ? b0 : t;
    const bInc = b0.filter(r => r.m).length / b0.length, tInc = t.filter(r => r.m).length / t.length;
    const diff = (tInc - bInc) * 100;
    const ranks = sel.filter(r => r.m).map(r => r.pos);
    const flags = sel.reduce((s, r) => s + r.wrong.length, 0);
    const bFlags = b0.reduce((s, r) => s + r.wrong.length, 0);
    const daily = Array.from({length:DAYS}, (_, d) => { const ds = at(d); return ds.filter(r => r.m).length / ds.length; });
    const open = state.expanded === q;
    let html = `<tr class="q-row" data-action="expand" data-q="${esc(q)}" aria-expanded="${open}" tabindex="0">
      <td><b>${esc(q)}</b>${capOf(q) != null && p.start > capOf(q) ? `<div style="margin-top:4px"><span class="pill pill-warn" title="Reference price ${esc(p.refPrice)} is above this budget">Over budget: not counted in inclusion</span></div>` : ''}</td>
      <td class="num">${pct(bInc)}</td><td class="num">${pct(tInc)}</td>
      <td class="num"><span class="delta ${diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat'}">${diff > 0 ? '+' : diff < 0 ? '−' : ''}${Math.abs(diff).toFixed(0)} pts</span></td>
      <td><div class="edots">${ENGINES.map(e => { const r = sel.find(x => x.e === e.id); return `<span class="edot${r.m ? ' on' : ''}" title="${e.name}: ${r.m ? 'mentioned, position ' + r.pos : 'not mentioned'}">${e.short}</span>`; }).join('')}</div></td>
      <td class="num">${ranks.length ? (ranks.reduce((a, b) => a + b, 0) / ranks.length).toFixed(1) : '–'}</td>
      <td>${flags ? `<span class="pill pill-bad">${flags} wrong</span>` : '<span class="pill pill-good">Clean</span>'}${state.view === 'compare' ? `<div class="tiny muted" style="margin-top:4px">Baseline: ${bFlags} wrong</div>` : ''}</td>
      <td>${sparkline(daily)}</td>
      <td><button class="link-btn small" data-action="remove-q" data-q="${esc(q)}" aria-label="Remove query ${esc(q)}">Remove</button></td></tr>`;
    if (open){
      const card = (r, e) => `<b>${e.name}</b> ${r.m ? `<span class="pill pill-good">#${r.pos}</span>` : '<span class="pill">Not mentioned</span>'}
          <ol>${r.models.map(x => `<li class="${x === p.full ? 'own' : ''}">${esc(x)}</li>`).join('') || '<li class="muted">No models named</li>'}</ol>
          ${r.m ? `<div class="facts">${FACT_TYPES.map(ft => { const w = r.wrong.find(x => x.t === ft); return w ? `<span class="pill pill-bad" title="Said: ${esc(p.wrong[ft][w.v])}">${FACT_LABEL[ft]} ✕</span>` : `<span class="pill pill-good">${FACT_LABEL[ft]} ✓</span>`; }).join('')}</div><div class="tiny muted" style="margin-top:6px">${r.cited ? 'Linked to Dell.com' : 'Did not link to Dell.com'}</div>` : ''}
          <button class="btn btn-ghost btn-sm" style="margin-top:10px" data-action="evidence" data-q="${esc(q)}" data-e="${e.id}" data-d="${r.d}">View answer evidence</button>`;
      const cmpCard = (r0, r1, e) => `<b>${e.name}</b><div class="cmp-cols" style="margin-top:8px">
          <div><h5>Baseline, Aug 31</h5>${r0.m ? `<span class="pill pill-good">#${r0.pos}</span>` : '<span class="pill">Not mentioned</span>'}<div class="tiny" style="margin-top:6px">${r0.m ? (r0.wrong.length ? `<span style="color:var(--bad)">${r0.wrong.length} wrong fact${r0.wrong.length > 1 ? 's' : ''}</span>` : 'All facts right') : ''}</div></div>
          <div><h5>New, Sep 29</h5>${r1.m ? `<span class="pill pill-good">#${r1.pos}</span>` : '<span class="pill">Not mentioned</span>'}<div class="tiny" style="margin-top:6px">${r1.m ? (r1.wrong.length ? `<span style="color:var(--bad)">${r1.wrong.length} wrong fact${r1.wrong.length > 1 ? 's' : ''}</span>` : 'All facts right') : ''}</div></div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-ghost btn-sm" data-action="evidence" data-q="${esc(q)}" data-e="${e.id}" data-d="0">Baseline evidence</button><button class="btn btn-ghost btn-sm" data-action="evidence" data-q="${esc(q)}" data-e="${e.id}" data-d="${DAYS - 1}">New evidence</button></div>`;
      const cmp = state.view === 'compare';
      const label = cmp ? 'Baseline answers (Aug 31) next to today’s (Sep 29)' : state.view === 'baseline' ? 'Baseline answers, August 31' : `Today’s answers, ${fmtD(DEMO_TODAY, {month:'long', day:'numeric'})}`;
      html += `<tr><td colspan="9" class="detail-cell"><div class="small muted" style="margin:4px 0 8px">${label}</div><div class="engine-grid">${ENGINES.map(e => `<div class="engine-card">${cmp ? cmpCard(b0.find(x => x.e === e.id), t.find(x => x.e === e.id), e) : card(sel.find(x => x.e === e.id), e)}</div>`).join('')}</div></td></tr>`;
    }
    return html;
  }).join('');

  const claims = claimsFor(p.id);
  const baseCounts = Object.fromEntries(claimsFor(p.id, BASE_FROM, BASE_TO).map(c => [c.key, c.count]));
  const claimRows = claims.map(c => {
    const st = state.reviews[c.key];
    const status = st === 'approved' ? '<span class="pill pill-good">Approved</span>' : st === 'dismissed' ? '<span class="pill">Dismissed</span>' : '<span class="pill pill-warn">Needs review</span>';
    return `<tr class="claim-row"><td><span class="pill ${SEVERITY[c.t] === 'High' ? 'pill-bad' : 'pill-warn'}">${SEVERITY[c.t]}</span></td>
      <td><b>${FACT_LABEL[c.t]}</b><div class="tiny muted">${esc(engineById(c.e).name)}</div></td>
      <td class="num">${state.view === 'new' ? `${c.count}×` : `<span class="muted">${baseCounts[c.key] || 0}×</span> → <b>${c.count}×</b>`}</td>
      <td><span class="strike">${esc(c.claimed)}</span></td><td>${esc(c.truth)}</td>
      <td><span class="pill pill-good" title="${autoActions(c).join(', ')}">✓ All 4 done</span></td>
      <td><details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:600">View draft</summary><p class="small" style="margin:6px 0 0;max-width:34ch">${esc(draftFix(c))}</p></details></td>
      <td>${status}<div class="tiny muted" style="margin-top:4px">Owner: ${ACCOUNT.user}</div></td>
      <td>${st ? `<button class="link-btn small" data-action="undo-review" data-key="${c.key}">Undo</button>` : `<div class="review-actions"><button class="btn btn-primary btn-sm" data-action="approve" data-key="${c.key}">Approve fix</button><button class="btn btn-ghost btn-sm" data-action="dismiss" data-key="${c.key}">Dismiss</button></div>`}</td></tr>`;
  }).join('');

  const pr = profile(p);
  return `<div class="main-head"><div><h1>Queries</h1><p>The shopper questions we ask the AI assistants every day, and what they say back.</p></div>
    <div style="text-align:right"><button class="btn btn-primary" data-action="run" ${state.running ? 'disabled' : ''}>${state.running ? 'Checking…' : 'Run check now'}</button><div class="tiny muted" style="margin-top:6px" id="run-status">${state.lastRun ? 'Last run today at ' + state.lastRun : 'Last run today at 6:02 AM'}</div><div class="progress" id="run-progress" ${state.running ? '' : 'hidden'}><div></div></div></div></div>
  <div class="chips" role="group" aria-label="Products">${PRODUCTS.map(x => `<button class="chip" data-action="q-product" data-pid="${x.id}" aria-pressed="${x.id === p.id}">${esc(x.name)}<span class="count">${state.queries[x.id].length}/${MAX_QUERIES}</span></button>`).join('')}</div>
  <p class="small muted" style="margin-top:-8px">${ACCOUNT.plan} plan: ${PRODUCTS.length} of ${MAX_PRODUCTS} products, up to ${MAX_QUERIES} questions per product.</p>

  <div class="grid-2">
    <section class="panel"><div class="card-title"><h3>Add shopper questions for ${esc(p.name)}</h3><span class="muted small">${remaining} of ${MAX_QUERIES} slots left</span></div>
      <label for="q-text">Type one question per line</label>
      <textarea id="q-text" data-input="draft" placeholder="e.g. best laptop for editing 4K video" ${remaining ? '' : 'disabled'}>${esc(state.draft)}</textarea>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px">
        <button class="btn btn-primary btn-sm" data-action="add-q" ${remaining ? '' : 'disabled'}>Add questions</button>
        <label class="btn btn-ghost btn-sm" style="margin:0;${remaining ? '' : 'opacity:.5;pointer-events:none'}">Upload .txt or .csv<input type="file" accept=".txt,.csv,text/plain,text/csv" data-file="queries" class="sr" ${remaining ? '' : 'disabled'}></label>
      </div>
      <p class="hint">Uploaded questions appear in the box first so you can review them before adding.</p>
      ${state.addMsg ? `<p class="notice" role="status">${esc(state.addMsg)}</p>` : ''}
    </section>
    <section class="panel"><div class="card-title"><h3>Who asks these questions</h3><span class="muted small">Simulated shopper profile</span></div>
      ${donut(pr.intent, 'Shopper intent')}
      <div style="margin-top:18px">${bars(pr.age.map(a => ({label:'Age ' + a.label, value:a.value / 100, color:'var(--c1)'})), {max:.5})}</div>
    </section>
  </div>

  <section class="panel" style="margin-bottom:20px"><div class="card-title"><h3>Daily tracking from baseline</h3>${viewToggle()}</div>
    <p class="view-note" style="margin:0 0 12px">Baseline day Aug 31, new day Sep 29. Engine dots and positions show ${state.view === 'baseline' ? 'the baseline day' : 'today'}. Select a row to see ${state.view === 'compare' ? 'baseline and new answers side by side' : 'each engine’s answer'}.</p>
    <div class="table-scroll"><table><thead><tr><th>Question</th><th class="num">Baseline</th><th class="num">Today</th><th class="num">Change</th><th>Engines showing Dell</th><th class="num">Avg position</th><th>Fact check</th><th>30 days</th><th><span class="sr">Actions</span></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="9" class="muted">No questions yet. Add up to ${MAX_QUERIES} above to start tracking ${esc(p.name)}.</td></tr>`}</tbody></table></div></section>

  ${evidenceHTML(p)}
  ${answerLogHTML(p)}
  <section class="panel" style="margin-bottom:20px" id="halluc"><div class="card-title"><h3>Hallucination detection</h3><span class="muted small">Wrong claims about ${esc(p.name)} in the last 7 days</span></div>
    <p class="small muted">For every flag we automatically log the answer, alert you, draft a correction and schedule a re-test within 24 hours. Publishing a fix or reporting it to an AI provider waits for your approval.</p>
    ${claims.length ? `<div class="table-scroll"><table><thead><tr><th>Severity</th><th>Fact</th><th class="num">${state.view === 'new' ? 'Seen this week' : 'Baseline → new week'}</th><th>AI said</th><th>Verified fact</th><th>Done automatically</th><th>Drafted fix</th><th>Status</th><th>Your decision</th></tr></thead><tbody>${claimRows}</tbody></table></div>` : '<p class="muted">No wrong claims this week. Every answer matched your fact sheet.</p>'}
  </section>

  <div class="grid-2e">
    <section class="panel"><div class="card-title"><h3>Where shoppers are</h3></div>${bars(pr.region.map(r => ({label:r.label, value:r.value / 100, color:'var(--own)'})), {max:.4})}
      <div style="margin-top:18px">${donut(pr.device, 'Device used')}</div></section>
    <section class="panel"><div class="card-title"><h3>Audit log</h3><span class="muted small">Every action, with who did it</span></div>
      <div class="audit"><ul>${state.audit.slice().reverse().map(a => `<li><time>${esc(a.t)}</time>${esc(a.text)}</li>`).join('')}</ul></div></section>
  </div>`;
}


/* ---------- answer evidence & log ---------- */
const CLAIM_SENT = {
  price:(p, v) => `On price, the ${p.short}: ${v}.`,
  features:(p, v) => `Key specs: ${v}.`,
  availability:(p, v) => `Availability: ${v}.`,
  policy:(p, v) => `Dell’s terms: ${v}.`
};
function recordId(p, r){ const qi = state.queries[p.id].indexOf(r.q) + 1; return `${p.model.replace(/\s/g, '')}-${r.e.toUpperCase().slice(0, 4)}-Q${qi || 'X'}-D${String(r.d + 1).padStart(2, '0')}`; }
function dayLabel(d){ return `${fmtD(dayDate(d), {month:'short', day:'numeric'})}${d <= BASE_TO ? ' (baseline week)' : d >= CUR_FROM ? ' (new week)' : ''}`; }
function evidenceHTML(p){
  const ev = state.evidence;
  if (!ev || ev.pid !== p.id || !state.queries[p.id].includes(ev.q)) return '';
  const r = recordsFor(p, ev.q).find(x => x.e === ev.e && x.d === ev.d);
  if (!r) return '';
  const e = engineById(r.e);
  const claims = r.m ? FACT_TYPES.map(t => { const w = r.wrong.find(x => x.t === t); return {t, said: w ? p.wrong[t][w.v] : p.facts[t], ok: !w}; }) : [];
  const answer = `For “${r.q}”, the options worth comparing are ${r.models.length ? r.models.join(', ') : 'none named'}.` + (r.m ? ' ' + claims.map(c => CLAIM_SENT[c.t](p, c.said)).join(' ') : '');
  const cap = r.cap;
  const elig = !r.qual
    ? `The shopper set a ${'$' + cap.toLocaleString()} budget and the ${p.short} reference price is ${p.refPrice}. Leaving it out is correct, so this answer is excluded from the inclusion rate.`
    : r.m ? `The ${p.full} fits this question and was included at position ${r.pos} of ${r.models.length}.`
    : `The ${p.full} fits this question but was left out. Only competitor models were recommended.`;
  const firstWrong = claims.find(c => !c.ok);
  const action = !r.qual ? 'No action needed. This omission is expected.'
    : !r.m ? `Publish content that answers “${r.q}” directly: name the ${p.config} configuration, its price and who it is for, and add Product markup so assistants can match it to this question.`
    : firstWrong ? draftFix({pid:p.id, e:r.e, t:firstWrong.t, claimed:firstWrong.said, truth:p.facts[firstWrong.t]})
    : 'No action needed. Every checked claim matches the fact sheet.';
  return `<section class="panel evidence" id="evidence" style="margin-bottom:20px">
    <div class="card-title"><h3>Answer evidence</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-action="to-analyzer" data-pid="${p.id}">Open page in Website analyzer</button><button class="btn btn-ghost btn-sm" data-action="evidence-close">Close</button></div></div>
    <div class="ev-meta">
      <div><b>Record</b>${recordId(p, r)}</div>
      <div><b>AI engine</b>${esc(e.name)}</div>
      <div><b>Day</b>${dayLabel(r.d)}</div>
      <div><b>Result</b>${!r.qual ? 'Not relevant (over budget)' : r.m ? `Named, position ${r.pos}` : 'Left out'}</div>
    </div>
    <div class="ev-grid">
      <div><h4>Shopper’s question</h4><p style="font-size:1.1rem;margin-bottom:12px">“${esc(r.q)}”</p>
        <h4>Models recommended, in order</h4><ol style="padding-left:20px;margin:0">${r.models.map(x => `<li style="${x === p.full ? 'font-weight:700;color:var(--own)' : ''}">${esc(x)}</li>`).join('') || '<li class="muted">None</li>'}</ol></div>
      <div class="ev-answer"><h4 style="margin-bottom:6px">Simulated answer</h4>${esc(answer)}</div>
    </div>
    <div class="grid-2e" style="margin-bottom:16px">
      <div class="panel" style="background:var(--surface-2);border:0"><h4>Did the Dell model qualify?</h4><p class="small" style="margin:0">${esc(elig)}</p></div>
      <div class="panel" style="background:var(--surface-2);border:0"><h4>Reference used for checking</h4><p class="small" style="margin:0">${esc(p.config)}. ${esc(p.refPrice)}. Source: ${esc(p.refSource)}.</p></div>
    </div>
    ${claims.length ? `<h4>Claim checks</h4>${claims.map(c => `<div class="claim-check"><span>“${esc(c.said)}”</span><span class="pill ${c.ok ? 'pill-good' : 'pill-bad'}">${c.ok ? 'Correct' : 'Incorrect'}</span><span class="ref">${FACT_LABEL[c.t]} reference: ${esc(p.facts[c.t])}</span></div>`).join('')}` : '<p class="small muted">No Dell claims to check because the model wasn’t named.</p>'}
    <div class="notice" style="margin-bottom:0"><b>Recommended fix:</b> ${esc(action)}</div>
  </section>`;
}
function answerLogHTML(p){
  const L = state.log;
  const all = state.queries[p.id].flatMap(q => recordsFor(p, q))
    .filter(r => L.engine === 'all' || r.e === L.engine)
    .filter(r => L.status === 'all' || (L.status === 'named' && r.m) || (L.status === 'omitted' && r.qual && !r.m) || (L.status === 'wrong' && r.wrong.length))
    .sort((a, b) => b.d - a.d || a.e.localeCompare(b.e));
  const shown = all.slice(0, L.shown);
  return `<section class="panel" style="margin-bottom:20px"><div class="card-title"><h3>Answer log</h3><span class="muted small">Every answer behind the numbers for ${esc(p.short)}</span></div>
    <div class="toolbar" style="margin-bottom:8px">
      <label class="sr" for="log-eng">Engine</label><select id="log-eng" data-change="logEngine"><option value="all">All engines</option>${ENGINES.map(e => `<option value="${e.id}" ${L.engine === e.id ? 'selected' : ''}>${e.name}</option>`).join('')}</select>
      <label class="sr" for="log-st">Result</label><select id="log-st" data-change="logStatus">${[['all','All results'],['named','Dell named'],['omitted','Qualified but left out'],['wrong','Has a wrong fact']].map(([v, l]) => `<option value="${v}" ${L.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span class="small muted">${all.length} answers</span>
    </div>
    ${shown.map(r => `<div class="log-row"><div><b>${esc(engineById(r.e).name)}, ${dayLabel(r.d)}</b><div>“${esc(r.q)}”</div></div>
      <div style="text-align:right">${!r.qual ? '<span class="pill">Over budget</span>' : r.m ? `<span class="pill pill-good">Named, #${r.pos}</span>` : '<span class="pill pill-warn">Left out</span>'}${r.wrong.length ? ` <span class="pill pill-bad">${r.wrong.length} wrong</span>` : ''}<div><button class="link-btn small" data-action="evidence" data-q="${esc(r.q)}" data-e="${r.e}" data-d="${r.d}">Evidence</button></div></div>
      <div class="recs">Recommended: ${r.models.map(esc).join(', ') || 'none'}</div></div>`).join('') || '<p class="muted">No answers match these filters.</p>'}
    ${all.length > L.shown ? `<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-action="log-more">Show 12 more</button>` : ''}
  </section>`;
}


/* ---------- report / emergency ---------- */
const ALL_RULE = {red:3, yellow:5};
const DAY_RULE = {redScore:30, yellowScore:40, redHigh:4, yellowHigh:2};
function dayStatus(pid, d){
  const recs = getRecs({product:pid, from:d, to:d});
  const m = metrics(recs);
  const high = recs.reduce((n, r) => n + r.wrong.filter(w => SEVERITY[w.t] === 'High').length, 0);
  const status = (m.visibility < DAY_RULE.redScore || high >= DAY_RULE.redHigh) ? 'red' : (m.visibility < DAY_RULE.yellowScore || high >= DAY_RULE.yellowHigh) ? 'yellow' : 'grey';
  return {d, score:m.visibility, high, status, m};
}
const STATUS_RANK = {red:2, yellow:1, grey:0};
const STATUS_LABEL = {red:'Poor', yellow:'Mixed', grey:'Good'};
function productHealth(p){
  const wk = metrics(getRecs({product:p.id, from:CUR_FROM, to:CUR_TO}));
  const prev = metrics(getRecs({product:p.id, from:16, to:22}));
  const base = metrics(getRecs({product:p.id, from:BASE_FROM, to:BASE_TO}));
  const openHigh = claimsFor(p.id).filter(c => SEVERITY[c.t] === 'High' && !state.reviews[c.key]);
  const reasons = [];
  const geoDrop = prev.visibility - wk.visibility;
  if (geoDrop >= 1) reasons.push({k:'geo', text:`GEO score down ${geoDrop} points week over week (${prev.visibility} → ${wk.visibility})`});
  if ((prev.inclusion - wk.inclusion) * 100 >= 3) reasons.push({k:'inclusion', text:`Named in fewer relevant answers: ${pct(prev.inclusion)} → ${pct(wk.inclusion)}`});
  if (wk.halluc != null && prev.halluc != null && (wk.halluc - prev.halluc) * 100 >= 3) reasons.push({k:'halluc', text:`More answers with wrong facts: ${pct(prev.halluc)} → ${pct(wk.halluc)}`});
  if (wk.brandRank > prev.brandRank) reasons.push({k:'rank', text:`Dropped from #${prev.brandRank} to #${wk.brandRank} among brands`});
  if (openHigh.length >= 2) reasons.push({k:'claims', text:`${openHigh.length} high-severity wrong claims still open (price or availability)`});
  const declined = reasons.some(r => r.k !== 'claims');
  const status = (openHigh.length >= 5 || geoDrop >= 8) ? 'Emergency' : declined ? 'Worse' : reasons.length ? 'Watch' : 'Stable';
  return {p, wk, prev, base, openHigh, reasons, geoDrop, status};
}
const WHY = {
  geo:'Your GEO score is the best single signal of whether AI assistants are sending shoppers your way. A falling score usually means fewer recommendations before any change shows up in site traffic.',

/* ---------- ROI & sales model (Learn) ---------- */
const CTR_TOP = .10; // share of shoppers who click through when you're named first; scaled by 1 ÷ position
const money = v => '$' + Math.round(v).toLocaleString();
function roiFor(pid, from, to){
  const R = state.roi, m = metrics(getRecs({product:pid, from, to})), p = prod(pid);
  const answers = R.answers / PRODUCTS.length;                       // monthly AI answers for this product
  const visits = answers * m.inclusion * CTR_TOP * m.rankScore;       // shoppers sent to Dell.com
  const orders = visits * R.conv / 100;
  const sales = orders * p.start;                                     // reference price as order value
  const exposed = orders * (m.halluc || 0);                           // orders whose AI answer had a wrong fact
  return {p, m, visits, orders, sales, exposed};
}
function roiModel(){
  const base = PRODUCTS.map(p => roiFor(p.id, BASE_FROM, BASE_TO));
  const cur = PRODUCTS.map(p => roiFor(p.id, CUR_FROM, CUR_TO));
  const sum = (arr, k) => arr.reduce((n, x) => n + x[k], 0);
  const T = k => ({b: sum(base, k), c: sum(cur, k)});
  const sales = T('sales'), orders = T('orders'), visits = T('visits'), exposed = T('exposed');
  const cost = Number(PLANS[state.roi.plan].price.replace('$', ''));
  const gain = (sales.c - sales.b) * state.roi.margin / 100;         // extra gross profit per month
  const roi = (gain - cost) / cost;
  const payback = gain > 0 ? cost / (gain / 30) : null;             // days
  return {base, cur, sales, orders, visits, exposed, cost, gain, roi, payback};
}
function dailySales(){
  const R = state.roi;
  const perDay = PRODUCTS.map(p => Array.from({length:DAYS}, (_, d) => {
    const m = metrics(getRecs({product:p.id, from:d, to:d}));
    return R.answers / PRODUCTS.length / 30 * m.inclusion * CTR_TOP * m.rankScore * R.conv / 100 * p.start;
  }));
  const total = Array.from({length:DAYS}, (_, d) => perDay.reduce((n, arr) => n + arr[d], 0));
  const avg = total.map((_, d) => { const w = total.slice(Math.max(0, d - 6), d + 1); return w.reduce((a, b) => a + b, 0) / w.length; });
  return {total, avg};
}
function salesChart(total, avg){

  const top = Math.ceil(mx / step) * step;
  const x = i => pl + i * iw / (n - 1), y = v => pt + ih - v / top * ih, bw = iw / n * .7;
  let g = `<rect x="${x(BASE_FROM) - bw}" y="${pt}" width="${x(BASE_TO) - x(BASE_FROM) + 2 * bw}" height="${ih}" style="fill:var(--accent-soft)"/><text x="${(x(BASE_FROM) + x(BASE_TO)) / 2}" y="${pt + 12}" text-anchor="middle" style="font-weight:600">Baseline</text>

  for (let v = 0; v <= top + 1e-6; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" ${v ? 'stroke-dasharray="3 4"' : ''}/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? '$' + (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : '$' + v}</text>`;
  total.forEach((v, i) => { g += `<rect x="${x(i) - bw / 2}" y="${y(v)}" width="${bw}" height="${pt + ih - y(v)}" rx="2" style="fill:var(--c1)" opacity=".45"><title>${fmtD(dayDate(i))}: ${money(v)} estimated</title></rect>`; if ((i % 7 === 0 && n - 1 - i >= 4) || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtD(dayDate(i))}</text>`; });
  g += `<path d="${avg.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}" fill="none" style="stroke:var(--own)" stroke-width="3" stroke-linejoin="round"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated daily AI-referred sales over 30 days">${g}</svg><div class="legend"><span><i style="background:var(--c1);opacity:.45;height:10px"></i>Estimated sales per day</span><span><i style="background:var(--own)"></i>7-day average</span></div></div>`;
}

function analyzePage(p){
  const pg = p.page;
  const updated = fromIso(pg.updated), ageDays = Math.round((DEMO_TODAY - updated) / 864e5);
  const qText = state.queries[p.id].join(' ').toLowerCase();
  const kws = pg.kws.map(([kw, n]) => ({kw, page:n, asked: kw.toLowerCase().split(' ').every(w => qText.includes(w.replace('$', ''))) }));
  const kwFound = kws.filter(k => k.page > 0).length;
  const openClaims = claimsFor(p.id).filter(c => !state.reviews[c.key]);
  const seo = [
    {ok: pg.title.length <= 60, name:'Page title is 60 characters or less', val:`${pg.title.length} characters`, fix:'Shorten the page title to 60 characters or less so search results show it in full.'},
    {ok: pg.meta.length >= 120 && pg.meta.length <= 160, name:'Meta description is 120–160 characters', val:`${pg.meta.length} characters`, fix:'Write a 120–160 character description that states the price, main benefit and who it’s for.'},
    {ok: pg.alt >= .9, name:'Images have descriptive alt text', val:pct(pg.alt), fix:'Describe every product image in its alt text, including model, size and color.'},
    {ok: pg.schema.price, name:'Product markup includes price', val: pg.schema.price ? 'Found' : 'Missing', fix:'Add the price to your product markup (schema.org Product, offers.price).'},
    {ok: pg.schema.reviews, name:'Review and rating markup', val: pg.schema.reviews ? 'Found' : 'Missing', fix:'Add aggregate rating markup from real customer reviews.'}
  ];
  const geo = [
    {ok: pg.faq, name:'Answers shopper questions directly (FAQ)', val: pg.faq ? 'Found' : 'Missing', fix:'Add a short FAQ built from your tracked shopper questions. AI assistants lift direct answers.'},
    {ok: pg.words >= 300, name:'Enough plain-language detail (300+ words)', val:`${pg.words} words`, fix:'Expand the description to at least 300 words of specs and use cases written in plain sentences.'},
    {ok: pg.schema.availability, name:'Stock status stated in markup', val: pg.schema.availability ? 'Found' : 'Missing', fix:'Add stock status to your product markup (offers.availability) so AI stops guessing whether you’re in stock.'},
    {ok: pg.schema.returns, name:'Return policy stated in markup', val: pg.schema.returns ? 'Found' : 'Missing', fix:`Add return-policy markup stating “${p.facts.policy}”. AI assistants are currently guessing your policy.`},
    {ok: ageDays <= 90, name:'Updated in the last 90 days', val:`${ageDays} days ago`, fix:'Refresh the page and show the date. AI assistants favor sources that look current.'},
    {ok: kwFound / kws.length >= .5, name:'Uses the words shoppers use (half or more)', val:`${kwFound} of ${kws.length} phrases`, fix:'Work the missing shopper phrases from the keyword table into your description and FAQ.'},
    {ok: openClaims.length === 0, name:'AI answers match your fact sheet', val: openClaims.length ? `${openClaims.length} open wrong claim${openClaims.length > 1 ? 's' : ''}` : 'All match', fix:'Review the open wrong claims in Queries and make the right facts easy to find on this page.'}
  ];
  const checks = [...seo.map(c => ({...c, kind:'SEO'})), ...geo.map(c => ({...c, kind:'GEO'}))];
  const sc = list => Math.round(list.filter(c => c.ok).length / list.length * 100);
  const seoScore = sc(seo), geoScore = sc(geo), score = sc(checks);
  const recs = [...geo, ...seo].filter(c => !c.ok).map(c => `${geo.includes(c) ? 'GEO' : 'SEO'}: ${c.fix}`);
  kws.filter(k => k.page === 0).forEach(k => recs.push(`GEO: Use the phrase “${k.kw}” on the page. ${k.asked ? 'Shoppers ask about it in your tracked questions.' : 'It’s a common way shoppers describe this product.'}`));
  const topClaim = openClaims[0];
  if (topClaim) recs.unshift(`GEO: AI is saying “${topClaim.claimed}” (${FACT_LABEL[topClaim.t].toLowerCase()}) on ${engineById(topClaim.e).name}. Make “${topClaim.truth}” easy to find on this page.`);
  return {checks, seo, geo, seoScore, geoScore, score, kws, recs};

}
function highlight(text, kws){
  let out = esc(text);
  kws.filter(k => k.page > 0).forEach(k => { const re = new RegExp(k.kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'); out = out.replace(re, m => `<mark class="kw">${m}</mark>`); });
  return out;
}

function chatReply(text){
  const t = text.toLowerCase();
  if (/price|cost|\$/.test(t)) return 'Price errors usually come from old listings or missing product markup. Add offers.price to the page and approve the drafted fix in Queries; we’ll re-test within 24 hours.';
  if (/schema|markup|structured/.test(t)) return 'Product markup is a small block of code that states your price, stock and return policy in a format AI can read reliably. Jordan on our team can walk you through it in a meeting.';
  if (/review|rating/.test(t)) return 'Real reviews help assistants describe you with confidence. Ask recent buyers for a review and add rating markup. Never write or buy reviews; it backfires and breaks our policy.';
  if (/halluc|wrong|incorrect|false/.test(t)) return 'When an assistant gets a fact wrong, the fastest fix is making the right fact unmissable on your page, then sending a correction report. You approve the report before it goes out.';
  if (/meet|call|schedule|talk/.test(t)) return 'Happy to meet! Use the scheduler below this page to pick a consultant, a time, and online or in person.';
  if (/keyword|seo|rank/.test(t)) return 'Look at the keyword table: any phrase with 0 on the page but asked by shoppers is a quick win. Use the exact words shoppers use, naturally, in your description and FAQ.';
  return 'Good question. Could you tell me which product or page you mean? I can look at your latest analyzer results with you.';
}

function addAudit(text){ state.audit.push({t: nowTime(), text}); }
function addQueries(lines){
  const p = prod(state.qProduct), qs = state.queries[p.id];
  const existing = new Set(qs.map(q => q.toLowerCase()));
  const clean = [...new Set(lines.map(l => l.trim().replace(/^"|"$/g, '')).filter(l => l && l.length <= 150))].filter(l => !existing.has(l.toLowerCase()));
  const room = MAX_QUERIES - qs.length;
  const added = clean.slice(0, room), skipped = clean.length - added.length;
  added.forEach(q => qs.push(q));
  saveQueries();
  if (added.length) addAudit(`${ACCOUNT.user} added ${added.length} question${added.length > 1 ? 's' : ''} for ${p.name}.`);
  state.draft = '';
  state.addMsg = !clean.length ? 'Nothing new to add. Those questions are empty or already tracked.' : `Added ${added.length} question${added.length !== 1 ? 's' : ''}.${skipped ? ` ${skipped} skipped: the ${ACCOUNT.plan} plan tracks up to ${MAX_QUERIES} per product.` : ''}`;
  render();
}
function runCheck(){
  state.running = true; render();
  const total = state.queries[state.qProduct].length * ENGINES.length;
  let i = 0;
  const tick = setInterval(() => {
    i++;
    const bar = $('#run-progress div'), st = $('#run-status');
    if (bar) bar.style.width = (i / ENGINES.length * 100) + '%';
    if (st && i <= ENGINES.length) st.textContent = `Asking ${ENGINES[i - 1].name}…`;
    if (i >= ENGINES.length){
      clearInterval(tick);
      setTimeout(() => {
        state.running = false; state.lastRun = nowTime();
        addAudit(`Automatic: manual check run on ${prod(state.qProduct).name} (${total} answers). Results match today’s daily run.`);
        render(); toast('Check complete. Results are up to date.');
      }, 400);
    }
  }, 550);
}
function runAnalyze(){
  const a = state.an, url = (a.url || '').trim();
  a.error = ''; a.result = null;
  let match = PRODUCTS.find(p => url.toLowerCase().includes(p.page.path));
  if (!/^https?:\/\//i.test(url)){ a.error = 'Enter a full page address starting with https://'; render(); return; }

  a.product = match.id; a.busy = true; render();

}

    case 'loop-sign': state.loop.signed = {user:ACCOUNT.user, t:nowTime()}; addAudit(`${ACCOUNT.user} signed off on the ROI report${state.loop.actual.b !== '' && state.loop.actual.c !== '' ? ' using actual sales' : ''}.`); toast('Report signed off.'); keepScroll(); break;
    case 'loop-unsign': state.loop.signed = null; addAudit(`${ACCOUNT.user} withdrew sign-off on the ROI report.`); keepScroll(); break;
    case 'upgrade': toast('Plan upgrades open with the full launch. Sign in as Rattlerman to try Premium.'); break;
    case 'logout': state.user = null; store.del('sv_user'); location.hash = '#/home'; break;
    case 'engine': state.engine = el.dataset.engine; render(); break;
    case 'view': state.view = el.dataset.view; render(); break;
    case 'evidence': state.evidence = {pid: state.qProduct, q: el.dataset.q, e: el.dataset.e, d: Number(el.dataset.d)}; render(); $('#evidence')?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); break;
    case 'evidence-close': state.evidence = null; render(); break;
    case 'log-more': state.log.shown += 12; render(); break;
    case 'to-analyzer': { const px = prod(el.dataset.pid); state.an.product = px.id; state.an.url = `https://www.${ACCOUNT.domain}${px.page.path}`; state.an.result = null; state.an.error = ''; location.hash = '#/app/analyzer'; break; }
    case 'q-product': state.qProduct = el.dataset.pid; state.expanded = null; state.evidence = null; state.log.shown = 12; state.addMsg = ''; state.draft = ''; render(); break;
    case 'expand': state.expanded = state.expanded === el.dataset.q ? null : el.dataset.q; render(); break;
    case 'remove-q': { const q = el.dataset.q, list = state.queries[state.qProduct]; state.queries[state.qProduct] = list.filter(x => x !== q); saveQueries(); addAudit(`${ACCOUNT.user} stopped tracking “${q}”.`); state.addMsg = ''; if (state.expanded === q) state.expanded = null; render(); break; }
    case 'add-q': addQueries(state.draft.split(/\r?\n/)); break;
    case 'run': runCheck(); break;
    case 'approve': case 'dismiss': {
      const key = el.dataset.key, [pid, eid, t, v] = key.split('|'), p = prod(pid);
      state.reviews[key] = act === 'approve' ? 'approved' : 'dismissed';
      addAudit(act === 'approve'
        ? `${ACCOUNT.user} approved the ${FACT_LABEL[t].toLowerCase()} fix for ${p.name}: page update queued and correction report sent to ${engineById(eid).name}.`
        : `${ACCOUNT.user} dismissed the ${FACT_LABEL[t].toLowerCase()} flag for ${p.name} on ${engineById(eid).name} as a false positive.`);
      render(); toast(act === 'approve' ? 'Fix approved. We’ll re-test within 24 hours.' : 'Flag dismissed and logged.'); break; }
    case 'undo-review': { const key = el.dataset.key; delete state.reviews[key]; addAudit(`${ACCOUNT.user} reopened a flag for review.`); render(); break; }
    case 's-prev': case 's-next': { const m = state.sched.month; const n = new Date(m.getFullYear(), m.getMonth() + (act === 's-next' ? 1 : -1), 1); if (n >= new Date(2026, 8, 1) && n <= new Date(2026, 11, 1)){ state.sched.month = n; render(); } break; }
    case 's-day': Object.assign(state.sched, {date:el.dataset.date, agent:null, time:null, err:'', confirmed:null}); render(); break;
    case 's-slot': Object.assign(state.sched, {agent:el.dataset.agent, time:el.dataset.time, err:''}); render(); $('#schedule')?.scrollIntoView({block:'nearest'}); break;
    case 's-new': state.sched.confirmed = null; render(); break;
    case 's-cancel': { state.meetings = state.meetings.filter(m => String(m.id) !== el.dataset.id); addAudit(`${ACCOUNT.user} cancelled a consultant meeting.`); render(); toast('Meeting cancelled.'); break; }
    case 'play': playVideo(el.dataset.vid); break;
    case 'ev-prev': case 'ev-next': { const m = state.learn.evMonth; const n = new Date(m.getFullYear(), m.getMonth() + (act === 'ev-next' ? 1 : -1), 1); if (n >= new Date(2026, 9, 1) && n <= new Date(2026, 11, 1)){ state.learn.evMonth = n; render(); } break; }
    case 'ev-day': state.learn.evDate = state.learn.evDate === el.dataset.date ? null : el.dataset.date; render(); break;
    case 'ev-clear': state.learn.evDate = null; render(); break;
    case 'rsvp': { const id = el.dataset.ev; state.learn.rsvps[id] = !state.learn.rsvps[id]; render(); toast(state.learn.rsvps[id] ? 'Seat reserved. Details are on their way to your email.' : 'Reservation cancelled.'); break; }
  }
});
root.addEventListener('keydown', e => {
  const row = e.target.closest('.q-row');
  if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row){ e.preventDefault(); row.click(); }
});
root.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  if (k === 'draft') state.draft = v;
  if (k === 'loopNote') state.loop.assumpNote = v;
  if (k === 'anUrl') state.an.url = v;
  if (k === 'sLink') state.sched.link = v;
  if (k === 'sAddress') state.sched.address = v;
  if (k === 'sDesc') state.sched.desc = v;
});
root.addEventListener('change', e => {
  if (e.target.dataset.roiact){
    const v = e.target.value.trim();
    state.loop.actual[e.target.dataset.roiact] = v === '' ? '' : String(Math.max(0, Math.round(Number(v) || 0)));
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.dataset.roi){
    const k = e.target.dataset.roi, v = e.target.value;
    if (state.loop.assump === 'approved'){ state.loop.assump = 'changed'; state.loop.signed = null; }
    const lim = {answers:[1000, 10000000], conv:[.1, 20], margin:[1, 80]};
    state.roi[k] = k === 'plan' ? v : Math.min(lim[k][1], Math.max(lim[k][0], Number(v) || lim[k][0]));
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const k = e.target.dataset.change;
  if (k === 'dashProduct'){ state.dashProduct = e.target.value; render(); }
  if (k === 'reportProduct'){ state.report.product = e.target.value; state.report.day = null; render(); }
  if (k === 'rvProduct'){ state.reviews2.product = e.target.value; render(); }
  if (k === 'logEngine'){ state.log.engine = e.target.value; state.log.shown = 12; render(); }
  if (k === 'logStatus'){ state.log.status = e.target.value; state.log.shown = 12; render(); }
  if (k === 'anProduct'){ const p = prod(e.target.value); state.an.product = p.id; state.an.url = `https://www.${ACCOUNT.domain}${p.page.path}`; state.an.result = null; state.an.error = ''; render(); }
  if (k === 'sMode'){ state.sched.mode = e.target.value; state.sched.err = ''; render(); }
  if (e.target.dataset.file === 'queries'){
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 200000){ state.addMsg = 'That file is too large. Upload a .txt or .csv under 200 KB.'; render(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      let lines = String(reader.result).split(/\r?\n/).map(l => l.split(',')[0].trim().replace(/^"|"$/g, '')).filter(Boolean);
      if (lines[0] && /^(query|question)s?$/i.test(lines[0])) lines = lines.slice(1);
      state.draft = lines.join('\n');
      state.addMsg = `Loaded ${lines.length} line${lines.length !== 1 ? 's' : ''} from ${f.name}. Review them, then select Add questions.`;
      render();
    };
    reader.onerror = () => { state.addMsg = 'That file couldn’t be read. Try saving it as plain text.'; render(); };
    reader.readAsText(f);
  }
});
root.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'login'){
    const u = $('#l-user').value.trim(), p = $('#l-pass').value;
    const err = $('#l-err');
    if (!u || !p){ err.textContent = 'Enter your username and password.'; return; }
    const acct = ACCOUNTS[u];
    if (acct && p === acct.pass){ state.twoStep = {user:u, code:newCode(), sent:Date.now(), tries:0, hidden:false, err:''}; render(); $('#tf-code')?.focus(); }
    else { err.textContent = 'That username and password don’t match an account. Check both and try again.'; $('#l-pass').value = ''; }
  }
  if (f === 'twostep'){
    const t = state.twoStep; if (!t) return;
    const v = $('#tf-code').value.replace(/\D/g, '');
    if (Date.now() - t.sent > 5 * 60 * 1000){ t.err = 'That code expired. Select “Send a new code.”'; render(); return; }
    if (v !== t.code){
      t.tries++;
      if (t.tries >= 3){ state.twoStep = null; render(); const er = $('#l-err'); if (er) er.textContent = 'Too many incorrect codes. Sign in again to get a new one.'; return; }
      t.err = `That code isn’t right. ${3 - t.tries} attempt${3 - t.tries === 1 ? '' : 's'} left.`; render(); $('#tf-code')?.focus(); return;
    }
    ACCOUNT = ACCOUNTS[t.user]; state.user = t.user; store.set('sv_user', t.user); state.twoStep = null;
    location.hash = '#/app/dashboard';
  }
  if (f === 'signup'){
    $('#s-note').innerHTML = '<p class="notice" role="status">New sign-ups open with the full launch. For this demo, use Sign in with the existing business account.</p>';
  }
  if (f === 'contact'){
    const n = $('#c-name').value.trim(), em = $('#c-email').value.trim(), m = $('#c-msg').value.trim(), err = $('#c-err');
    if (!n || !m || !/^\S+@\S+\.\S+$/.test(em)){ err.textContent = 'Add your name, a valid email and a message.'; return; }
    e.target.innerHTML = `<h3>Message sent</h3><p class="muted" style="margin:0">Thanks, ${esc(n)}. We reply within one business day. (Simulated in this demo.)</p>`;
  }
  if (f === 'analyze') runAnalyze();
  if (f === 'chat'){ const i = $('#chat-in'), t = i.value.trim(); if (!t) return; i.value = ''; sendChat(t); }
  if (f === 'book'){
    const s = state.sched;
    if (s.mode === 'inperson' && s.address.trim().length < 5){ s.err = 'Add the address where you’d like to meet.'; render(); return; }
    if (s.mode === 'online' && s.link.trim() && !/^https?:\/\/\S+$/i.test(s.link.trim())){ s.err = 'The meeting link should start with https://'; render(); return; }
    if (s.desc.trim().length < 5){ s.err = 'Tell us briefly what you’d like to talk about.'; render(); return; }
    const m = {id: Date.now(), agent:s.agent, date:s.date, time:s.time, mode:s.mode, link:s.link.trim(), address:s.address.trim(), desc:s.desc.trim()};
    state.meetings.push(m);
    addAudit(`${ACCOUNT.user} booked a ${m.mode === 'online' ? 'online' : 'in-person'} meeting with ${agentById(m.agent).name} on ${fmtD(fromIso(m.date))}.`);
    Object.assign(s, {confirmed:m, agent:null, time:null, date:null, link:'', address:'', desc:'', err:''});
    render(); toast('Meeting booked.');
  }
});

render();
</script>
</body>
